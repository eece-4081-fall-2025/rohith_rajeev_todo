<!DOCTYPE html>
<html>

<head>
    <title>My Todo List</title>
</head>

<body>
    <h1>My Tasks</h1>

    <form method="post" action="{% url 'create_task' %}">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            <form method="post" action="{% url 'toggle_task' task.id %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">
                    {% if task.completed %}✓{% else %}○{% endif %}
                </button>
            </form>

            {% if task.completed %}
            <s>{{ task.title }}</s>
            {% else %}
            {{ task.title }}
            {% endif %}

            <small>({{ task.created_date|date:"M d, Y" }})</small>

            <a href="{% url 'edit_task' task.id %}">Edit</a>
            <a href="{% url 'delete_task' task.id %}">Delete</a>
        </li>
        {% empty %}
        <li>No tasks yet. Add your first task above!</li>
        {% endfor %}
    </ul>
</body>

</html>
